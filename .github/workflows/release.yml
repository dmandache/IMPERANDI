name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[all]"

      - name: Run lint
        run: python -m ruff check .

      - name: Run unit tests
        run: >-
          python -m pytest -m "not slow"
          --cov=imperandi
          --cov-report=term-missing
          --cov-fail-under=70

  build:
    name: Build and verify distributions
    needs: test
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.validate-tag.outputs.prerelease }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install --upgrade build packaging twine

      - name: Validate release tag
        id: validate-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from packaging.version import InvalidVersion, Version

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit(f"Release tag must start with 'v': {tag}")
          try:
              release = Version(tag[1:])
          except InvalidVersion as exc:
              raise SystemExit(f"Release tag is not a valid version: {tag}") from exc
          if release.local is not None:
              raise SystemExit("PyPI release tags cannot contain a local version segment")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              is_prerelease = release.is_prerelease or release.is_devrelease
              print(f"prerelease={str(is_prerelease).lower()}", file=output)
          print(f"Validated release version {release}")
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify project-local configuration is excluded
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath

          artifacts = [
              *Path("dist").glob("*.whl"),
              *Path("dist").glob("*.tar.gz"),
          ]
          if len(artifacts) != 2:
              raise SystemExit(f"Expected one wheel and one sdist, found: {artifacts}")

          for artifact in artifacts:
              if artifact.suffix == ".whl":
                  with zipfile.ZipFile(artifact) as archive:
                      members = archive.namelist()
              else:
                  with tarfile.open(artifact, "r:gz") as archive:
                      members = archive.getnames()
              forbidden = [
                  member
                  for member in members
                  if "dataset_configs" in PurePosixPath(member).parts
              ]
              if forbidden:
                  raise SystemExit(
                      f"Project-local dataset_configs leaked into {artifact}: {forbidden}"
                  )
          print("Verified project-local dataset_configs are absent")
          PY

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify built version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python - <<'PY'
          import os
          from importlib.metadata import version
          from packaging.version import Version

          expected = Version(os.environ["RELEASE_TAG"][1:])
          built = Version(version("imperandi"))
          if built != expected:
              raise SystemExit(
                  f"Built distribution version {built} does not match tag {expected}"
              )
          print(f"Verified imperandi {built}")
          PY

      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    if: github.repository == 'dmandache/IMPERANDI'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/imperandi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github:
    name: Create GitHub Release
    if: github.repository == 'dmandache/IMPERANDI'
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          release_flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${release_flags[@]}"
