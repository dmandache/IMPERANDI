[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imperandi"
dynamic = ["version"]
description = "Build analysis-ready CT and MR cohorts from heterogeneous DICOM data"
license = "Apache-2.0"
authors = [
  { name = "Diana Mandache" },
]
keywords = [
  "dicom", "nifti", "medical-imaging", "medical-image-processing",
  "radiomics", "pyradiomics", "totalsegmentator", "segmentation",
  "image-registration", "radiology", "ct", "mri", "liver",
  "cohort-building", "healthcare-ai", "reproducibility",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
readme = { text = "See [README.md on GitHub](https://github.com/dmandache/IMPERANDI#readme) for more details.", content-type = "text/markdown" }
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "unidecode",
  "tqdm",
  "pydicom",
  "dicom2nifti",
  "nibabel",
  "pyyaml",
]

[project.urls]
Homepage = "https://github.com/dmandache/IMPERANDI"
Repository = "https://github.com/dmandache/IMPERANDI"
Documentation = "https://imperandi.readthedocs.io/"
Issues = "https://github.com/dmandache/IMPERANDI/issues"
Discussions = "https://github.com/dmandache/IMPERANDI/discussions"
Changelog = "https://github.com/dmandache/IMPERANDI/releases"

[project.optional-dependencies]
registration = ["SimpleITK"]

segment = [
  "TotalSegmentator",
  "scikit-image>=0.20",
  "xgboost",  # Required by TotalSegmentator's contrast-phase predictor.
  "SimpleITK",
]

viewer = [
  "ipython",
  "matplotlib",
  "ipykernel",
  "ipympl",
  "ipywidgets",
  "panel",
  "param",
]

dev = [
  "pytest",
  "pytest-cov",
  "black[jupyter]",
  "ruff"
]

slow = [
  "idc-index",
]

all = ["imperandi[segment,viewer]"]
all-dev = ["imperandi[all,dev,slow]"]

[project.scripts]
imperandi = "imperandi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imperandi = ["builtin_datasets_config/manifests/*.yaml"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/slow"]
markers = [
  "slow: dataset-backed full pipeline tests",
]

[tool.ruff]
extend-exclude = ["*.ipynb", "**/*legacy*"]

[tool.ruff.lint]
# Ruff 0.16 expanded its implicit defaults substantially. Keep the project's
# established correctness-focused baseline explicit and version-independent.
select = ["E4", "E7", "E9", "F"]
