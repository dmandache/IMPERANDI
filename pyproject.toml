[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imperandi"
version = "0.0.0"
description = "IMaging PREprocessing And Normalization for Diagnostic Interoperability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pandarallel",
  "python-dateutil",
  "unidecode",
  "tqdm",
  "pydicom",
  "dicom2nifti",
  "nibabel",
]

[project.optional-dependencies]
segment = [
  "TotalSegmentator",
  "torchio",
  "scipy",
  "scikit-image",
]
dev = [
  "pytest",
  "pytest-cov",
  "black[jupyter]",
  "ruff",
  "ipykernel",
  "ipympl",
  "ipywidgets",
  "TotalSegmentator",
  "torchio",
  "scipy",
  "scikit-image",
]

[project.scripts]
imperandi = "imperandi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "slow: IRCAD dataset integration tests",
]
