[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imperandi"
dynamic = ["version"]
description = "IMaging PREprocessing And Normalization for Diagnostic Interoperability"
license = "Apache-2.0"
authors = [
  { name = "Diana Mandache" },
]
keywords = [
  "medical-imaging",
  "dicom",
  "nifti",
  "medical-image-processing",
  "healthcare-ai",
  "mri",
  "ct",
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pandarallel",
  "python-dateutil",
  "unidecode",
  "tqdm",
  "pydicom",
  "dicom2nifti",
  "nibabel",
  "pyyaml",
]

[project.urls]
Homepage = "https://github.com/dmandache/IMPERANDI"
Repository = "https://github.com/dmandache/IMPERANDI"
Documentation = "https://imperandi.readthedocs.io/"
Issues = "https://github.com/dmandache/IMPERANDI/issues"

[project.optional-dependencies]
segment = [
  "matplotlib",
  "TotalSegmentator",
  "torchio",
  "scipy",
  "scikit-image",
  "xgboost",
  "SimpleITK"
]

radiomics = [
  "pywavelets",
  "pyradiomics@git+https://github.com/radiomics/pyradiomics.git",   # because 3.1.0 sdist metadata is broken on PyPI right now
]

viewer = [
  "matplotlib",
  "ipykernel",
  "ipympl",
  "ipywidgets"
]

dev = [
  "pytest",
  "pytest-cov",
  "black[jupyter]",
  "ruff"
]

slow = [
  "idc-index",
]

all = ["imperandi[dev,segment,radiomics,viewer,slow]"]

[project.scripts]
imperandi = "imperandi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imperandi = ["builtin_datasets_config/manifests/*.yaml"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/slow"]
markers = [
  "slow: dataset-backed full pipeline tests",
]

[tool.ruff]
extend-exclude = ["*.ipynb", "**/*legacy*"]

[tool.ruff.lint]
# Ruff 0.16 expanded its implicit defaults substantially. Keep the project's
# established correctness-focused baseline explicit and version-independent.
select = ["E4", "E7", "E9", "F"]
