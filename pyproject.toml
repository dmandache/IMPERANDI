[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "imperandi"
version = "0.0.0"
description = "IMaging PREprocessing And Normalization for Diagnostic Interoperability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "pyarrow>=14",
  "pydantic>=2",
  "PyYAML>=6",
  "pandarallel",
  "python-dateutil",
  "unidecode",
  "tqdm",
  "pydicom",
  "dicom2nifti",
  "nibabel",
]

[project.optional-dependencies]
segment = [
  "matplotlib",
  "TotalSegmentator",
  "torchio",
  "scipy",
  "scikit-image",
  "xgboost",
  "SimpleITK"
]

radiomics = [
  "pywavelets",
  "pyradiomics@git+https://github.com/radiomics/pyradiomics.git",   # because 3.1.0 sdist metadata is broken on PyPI right now
]

dev = [
  "pytest",
  "pytest-cov",
  "black[jupyter]",
  "ruff",
  "ipykernel",
  "ipympl",
  "ipywidgets"
]

all = ["imperandi[dev,segment,radiomics]"]

[project.scripts]
imperandi = "imperandi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"imperandi.config" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
markers = [
  "slow: IRCAD dataset integration tests",
]

[tool.ruff]
extend-exclude = ["*.ipynb", "**/*legacy*"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.black]
target-version = ["py310"]
