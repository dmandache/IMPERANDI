# Built-in baseline manifest. Comments document the supported manifest contract;
# changing the values changes the corresponding pipeline stage.
dataset_name: generic

# Parse-time identifier policy. source accepts: auto, tags, or path. The three
# from_tag values are DICOM keywords; fallback: path uses directory components
# when the selected tag is unavailable.
id_extraction:
  source: auto
  force_dicom_read: false
  patient_key:
    from_tag: PatientName
    fallback: path
  study_id:
    from_tag: StudyInstanceUID
    fallback: path
  series_id:
    from_tag: SeriesInstanceUID
    fallback: path

# Optional trusted Python hook used to normalize patient_key during parsing.
# hook_module is relative to the imperandi package.
id_standardization:
  hook_module: datasets_config.hooks.generic
  function: standardize_patient_key

# Ordered phase fallback chain: the first resolved label wins. Supported
# strategy types are ontology, rules, and totalsegmentator (at most one each).
phase_curation:
  strategies:
    - type: rules
      name: metadata_rules
    # Consumes predictions written by `imperandi phase`; mapping keys are
    # case-insensitive raw labels and values are canonical output labels.
    - type: totalsegmentator
      name: totalsegmentator_prediction
      column: totalseg_phase
      modalities: [CT]
      confidence_columns:
        - totalseg_probability
        - totalseg_confidence
      mapping:
        native: NATIVE
        non_contrast: NATIVE
        no_contrast: NATIVE
        arterial: ARTERIAL
        arterial_early: ARTERIAL
        arterial_late: ARTERIAL
        portal: PORTAL_VENOUS
        venous: PORTAL_VENOUS
        portal_venous: PORTAL_VENOUS
        delayed: DELAYED
  unresolved_labels:
    - ""
    - OTHER
    - UNKNOWN
    - UNCLASSIFIED
    - NONE
  fallback: OTHER

# Executable, ordered cleaning pipeline. version currently must be 1. Step
# order matters: row cleanup precedes volume grouping, then volume curation.
cleaning:
  version: 1
  steps:
    - type: hook
      function: "datasets_config.hooks.generic:standardize_patient_key"
      source_columns: [patient_key]
    - type: coalesce_date
    - type: coalesce_time
    - type: sop_class
    - type: parse_image_type
    - type: filter
      name: scan_size_quality
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: Rows, op: is_null}
        - {column: Columns, op: is_null}
        - {column: SliceThickness, op: gt, value: 3.0}
    - type: filter
      # kind: keep|discard; scope: row|volume; logic: and|or.
      # Operators: eq, ne, in, not_in, contains, icontains, regex, lt, lte,
      # gt, gte, is_null, not_null. `in`/`not_in` require a list value.
      kind: keep
      scope: row
      logic: and
      rules:
        - column: Modality
          op: in
          value: [CT, MR, MRI]
        - column: sop_class
          op: in
          value:
            - CTImageStorage
            - EnhancedCTImageStorage
            - MRImageStorage
            - EnhancedMRImageStorage
    - type: filter
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: ModalitiesInStudy, op: contains, value: PT}
        - {column: ModalitiesInStudy, op: contains, value: NM}
    - type: filter
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: ImageType, op: contains, value: LOCALIZER}
        - {column: SeriesDescription, op: icontains, value: scout}
    - type: normalize_string
      column: SeriesDescription
    - type: filter
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: SeriesDescription, op: contains, value: pelvis}
        - {column: SeriesDescription, op: contains, value: crane}
        - {column: SeriesDescription, op: contains, value: rachis}
        - {column: SeriesDescription, op: contains, value: prostate}
        - {column: SeriesDescription, op: contains, value: phlebo}
        - {column: SeriesDescription, op: contains, value: meckel}
        - {column: SeriesDescription, op: contains, value: femur}
        - {column: SeriesDescription, op: contains, value: orl}
    - type: pixel_spacing_xy
    - type: filter
      kind: keep
      scope: row
      logic: and
      keep_null: true
      rules:
        - {column: PixelSpacingXY, op: lte, value: 1.25}
    - type: standardize_iop
    - type: classify_acquisition_plane
    - type: filter
      kind: keep
      scope: row
      logic: and
      rules:
        - {column: acquisition_axis, op: eq, value: Z}
    - type: build_volume_id
      # Detect repeated stacks, assign volume IDs, then merge near-duplicates.
      # Tolerances are in the units of their source DICOM geometry fields.
      preferred_columns:
        - patient_key
        - study_id
        - series_id
        - ImageType
        - AcquisitionNumber
        - ImageOrientationPatient
        - SliceThickness
        - PixelSpacingXY
      fallback_columns: [patient_key, study_id, series_id]
      series_group_columns: [patient_key, study_id, series_id]
      split_z_tolerance: 0.01
      min_slices: 8
      min_repeated_slice_fraction: 0.7
      merge_group_columns:
        - patient_key
        - study_id
        - series_id
        - ImageType
        - ImageOrientationPatient
        - SliceThickness
        - PixelSpacingXY
      merge_z_sources: [ImagePositionPatient, SliceLocation]
      merge_z_tolerance: 0.001
    - type: group_volumes
    - type: compute_volume_length
    - type: filter
      kind: keep
      scope: volume
      logic: and
      keep_null: true
      rules:
        - {column: volume_length, op: gte, value: 30.0}
        - {column: volume_length, op: lte, value: 1700.0}
    - type: compute_visit_order
    - type: compute_acquisition_order
    - type: modality_curation
    - type: finalize

# TotalSegmentator is currently the only backend. CT and MR have independent
# task lists (MRI is accepted as an MR alias). `extra` is passed through to the
# backend; output/fetch_output rename a produced mask in the cohort table.
segmentation:
  backend: totalsegmentator
  modalities:
    CT:
      tasks:
        - task: total
          extra:
            roi_subset: [liver]
            fastest: true
        - task: liver_lesions
          output: liver_tumor
          fetch_output: liver_lesions
        - task: liver_segments
      postprocess:
        # Merge logical task outputs, then optionally clean the merged mask.
        merge_keys: [liver, liver_tumor]
        output: liver
        radius_mm: 5.0
        largest_cc: true
        fill_holes: true
        close: true
    MR:
      tasks:
        - task: total_mr
          extra:
            roi_subset: [liver]
            fastest: true
        - task: liver_lesions_mr
          output: liver_tumor
          fetch_output: liver_lesions
        - task: liver_segments_mr
      postprocess:
        merge_keys: [liver, liver_tumor]
        output: liver
        radius_mm: 5.0
        largest_cc: true
        fill_holes: true
        close: true

radiomics:
  # `pyradiomics` follows the native PyRadiomics parameter-file structure.
  pyradiomics:
    setting:
      binWidth: 25
      resampledPixelSpacing: [1, 1, 1]
      resegmentRange: [-150, 250]
      correctMask: true
    imageType:
      Original: {}
  filters:
    # Each key is a cohort-table column; a row is retained when its value is in
    # the configured list. Multiple filter keys are combined with AND.
    phase: [PORTAL_VENOUS, ARTERIAL]
