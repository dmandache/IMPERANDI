# Built-in baseline manifest. Comments document the supported manifest contract;
# changing the values changes the corresponding pipeline stage.
dataset_name: generic

# Parse-time identifier policy. source accepts: auto, tags, or path. The three
# from_tag values are DICOM keywords; fallback: path uses directory components
# when the selected tag is unavailable.
id_extraction:
  source: auto
  force_dicom_read: false
  patient_key:
    from_tag: PatientName
    fallback: path
  study_id:
    from_tag: StudyInstanceUID
    fallback: path
  series_id:
    from_tag: SeriesInstanceUID
    fallback: path

# Optional trusted Python hook used to normalize patient_key during parsing.
# hook_module is relative to the imperandi package.
# id_standardization:
#   hook_module: imperandi.builtin_datasets_config.hooks.generic
#   function: standardize_patient_key

# Ordered phase fallback chain: the first resolved label wins. Supported
# strategy types are ontology, rules, and totalsegmentator (at most one each).
phase_curation:
  strategies:
    - type: rules
      name: metadata_rules
    # Consumes predictions written by `imperandi phase`; mapping keys are
    # case-insensitive raw labels and values are canonical output labels.
    - type: totalsegmentator
      name: totalsegmentator_prediction
      column: totalseg_phase
      modalities: [CT]
      confidence_columns:
        - totalseg_probability
        - totalseg_confidence
      mapping:
        native: NATIVE
        non_contrast: NATIVE
        no_contrast: NATIVE
        arterial: ARTERIAL
        arterial_early: ARTERIAL
        arterial_late: ARTERIAL
        portal: PORTAL_VENOUS
        venous: PORTAL_VENOUS
        portal_venous: PORTAL_VENOUS
        delayed: DELAYED
  unresolved_labels:
    - ""
    - OTHER
    - UNKNOWN
    - UNCLASSIFIED
    - NONE
  fallback: OTHER

# Executable, ordered cleaning pipeline. Step order matters: row cleanup
# precedes volume grouping, then volume curation.
cleaning:
  steps:
    # - type: hook
    #   function: "imperandi.builtin_datasets_config.hooks.generic:standardize_patient_key"
    #   source_columns: [patient_key]
    - type: coalesce_date
    - type: coalesce_time
    - type: sop_class
    - type: parse_image_type
    - type: filter
      name: discard_large_slice_thickness_CT
      kind: discard
      scope: row
      logic: and
      rules:
        - {column: SliceThickness, op: gt, value: 5.0}
        - {column: Modality, op: eq, value: CT}
    - type: filter
      name: discard_large_slice_thickness_MR
      kind: discard
      scope: row
      logic: and
      rules:
        - {column: SliceThickness, op: gt, value: 7.0}
        - {column: Modality, op: eq, value: MR}
    - type: filter
      # kind: keep|discard; scope: row|volume; logic: and|or.
      # Operators: eq, ne, in, not_in, contains, icontains, regex, lt, lte,
      # gt, gte, is_null, not_null. `in`/`not_in` require a list value.
      kind: keep
      scope: row
      logic: or
      rules:
        - column: Modality
          op: in
          value: [CT, MR, MRI]
        - column: sop_class
          op: in
          value:
            - CTImageStorage
            - EnhancedCTImageStorage
            - MRImageStorage
            - EnhancedMRImageStorage
    - type: filter
      name: discard_pet_and_nuclear
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: ModalitiesInStudy, op: contains, value: PT}
        - {column: ModalitiesInStudy, op: contains, value: NM}
    - type: filter
      name: discard_localizer_and_scout
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: ImageType, op: contains, value: LOCALIZER}
        - {column: SeriesDescription, op: icontains, value: localizer}
        - {column: SeriesDescription, op: icontains, value: scout}
    - type: normalize_string
      column: SeriesDescription
    - type: filter
      name: discard_non_liver
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: SeriesDescription, op: contains, value: crane}
        - {column: SeriesDescription, op: contains, value: rachis}
        - {column: SeriesDescription, op: contains, value: prostate}
        - {column: SeriesDescription, op: contains, value: phlebo}
        - {column: SeriesDescription, op: contains, value: femur}
        - {column: SeriesDescription, op: contains, value: orl}
    - type: pixel_spacing_xy
    - type: filter
      name: discard_large_pixel_spacing
      kind: discard
      scope: row
      rules:
        - {column: PixelSpacingXY, op: gt, value: 1.5}
    - type: standardize_iop
    - type: classify_acquisition_plane
    - type: filter
      name: keep_axial_acquisitions
      kind: keep
      scope: row
      logic: and
      keep_null: true
      rules:
        - {column: acquisition_axis, op: eq, value: Z}
    - type: build_volume_id
      # Detect repeated stacks, assign volume IDs, then merge near-duplicates.
      # Tolerances are in the units of their source DICOM geometry fields.
      preferred_columns:
        - patient_key
        - study_id
        - series_id
        - ImageType
        - AcquisitionNumber
        - ImageOrientationPatient
        - SliceThickness
        - PixelSpacingXY
      fallback_columns: [patient_key, study_id, series_id]
      series_group_columns: [patient_key, study_id, series_id]
      split_z_tolerance: 0.01
      min_slices: 8
      min_repeated_slice_fraction: 0.7
      merge_group_columns:
        - patient_key
        - study_id
        - series_id
        - ImageType
        - ImageOrientationPatient
        - SliceThickness
        - PixelSpacingXY
      merge_z_sources: [ImagePositionPatient, SliceLocation]
      merge_z_tolerance: 0.001
    - type: group_volumes
    - type: compute_volume_length
    - type: filter
      kind: keep
      scope: volume
      logic: and
      keep_null: true
      rules:
        - {column: volume_length, op: gte, value: 30.0}
        - {column: volume_length, op: lte, value: 1700.0}
    - type: compute_visit_order
    - type: compute_acquisition_order
    - type: modality_curation
    - type: finalize

# TotalSegmentator is currently the only backend. CT and MR have independent
# task lists (MRI is accepted as an MR alias). `extra` is passed through to the
# backend; output/fetch_output rename a produced mask in the cohort table.
segmentation:
  backend: totalsegmentator
  modalities:
    CT:
      tasks:
        - task: total
          extra:
            roi_subset: [liver]
            fastest: true
        - task: liver_lesions
          output: liver_tumor
          fetch_output: liver_lesions
        #- task: liver_segments
      # postprocess:
      #   operations:
      #     - op: largest_cc
      #       input: liver
      #       output: liver_clean
      #     - op: union
      #       inputs: [liver_clean, liver_tumor]
      #       output: liver_all
      #     - op: close
      #       input: liver_all
      #       output: liver_all
      #       radius_mm: 5.0
      #     - op: fill_holes
      #       input: liver_all
      #       output: liver_all
    MR:
      tasks:
        - task: total_mr
          extra:
            roi_subset: [liver]
            fastest: true
        - task: liver_lesions_mr
          output: liver_tumor
          fetch_output: liver_lesions
        #- task: liver_segments_mr
      # postprocess:
      #   operations:
      #     - op: union
      #       inputs: [liver, liver_tumor]
      #       output: liver_all
      #     - op: fill_holes
      #       input: liver_all
      #       output: liver_all

# Manifest-grouped organ registration and shared tumor segmentation.
# Explicit CLI consensus-method and affine-stage options override these settings.
registration:
  grouping_columns: [patient_key, study_id, Modality]
  organ_mask_column: mask_liver
  tumor_mask_column: mask_liver_tumor
  organ_consensus_method: anchor
  tumor_consensus_method: anchor
  enable_affine_stage: false
  early_stop_organ_dice: 0.95
  # Dataset-dependent QC: edge contact suggests partial coverage.
  partial_mask_boundary_margin_mm: 1.0
  accept_partial_organ_masks: true
  minimum_largest_component_fraction: 0.8
  minimum_accepted_organ_dice: 0.5
  minimum_common_field_of_view_fraction: 0.05
  maximum_pca_rotation_degrees: 45.0
  minimum_stage_dice_improvement:
    geometry: 0.001
    pca: 0.001
    mask_rigid: 0.002
    mi_rigid: 0.002
    mi_affine: 0.003
  maximum_optimizer_iterations: 100
  distance_map_crop_padding_mm: 25.0
  # Signed-distance clamp and MI boundary-band half-width in mm.
  organ_boundary_band_half_width_mm: 15.0
  # Keep original organ masks while mapping tumor consensus.
  preserve_source_organ_mask: false
  clip_tumor_consensus_to_organ: true
  consensus_probability_threshold: 0.5
  reference_selection_priority:
    - Modality: [CT, MR]
    - phase: [PORTAL_VENOUS, DELAYED, ARTERIAL, NATIVE, UNKNOWN]
    - mri_sequence: [T1, T2, DWI]
    - PixelSpacingXY: min
    - SliceThickness: min
    - registration_organ_volume_mm3: max

radiomics:
  # `pyradiomics` follows the native PyRadiomics parameter-file structure.
  modalities:
    CT:
      pyradiomics:
        setting:
          binWidth: 25
          resampledPixelSpacing: [1, 1, 1]
          resegmentRange: [-150, 250]
          correctMask: true
        imageType:
          Original: {}
    MR:
      pyradiomics:
        setting:
          binWidth: 25
          resampledPixelSpacing: [1, 1, 1]
          # MR intensities do not use the CT HU resegmentation range.
          correctMask: true
        imageType:
          Original: {}
  filters:
    # Each key is a cohort-table column; a row is retained when its value is in
    # the configured list. Multiple filter keys are combined with AND.
    phase: [PORTAL_VENOUS, ARTERIAL]
