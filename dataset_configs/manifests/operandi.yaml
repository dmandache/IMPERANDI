# Ordered cleaning workflow; version must currently be 1. Hook functions use
# `module:function` syntax and must declare outputs with @clean_hook.
cleaning:
  steps:
    # - type: hook
    #   function: "dataset_configs.hooks.operandi:standardize_operandi_patient_key"
    #   source_columns: [patient_key]
    # - type: hook
    #   function: "dataset_configs.hooks.operandi:extract_from_patient_key"
    #   source_columns: [patient_key]
    - type: coalesce_date
      candidates: [AcquisitionDate, AcquisitionDateTime, SeriesDate, StudyDate]
    - type: coalesce_time
      candidates: [FrameAcquisitionDateTime, AcquisitionTime, AcquisitionDateTime, SeriesTime, StudyTime]
    - type: sop_class
    - type: filter
      name: discard_large_slice_thickness_CT
      kind: discard
      scope: row
      logic: and
      keep_null: true
      rules:
        - {column: SliceThickness, op: gt, value: 5.0}
        - {column: Modality, op: eq, value: CT}
    - type: filter
      name: discard_large_slice_thickness_MR
      kind: discard
      scope: row
      logic: and
      keep_null: true
      rules:
        - {column: SliceThickness, op: gt, value: 10.0}
        - {column: Modality, op: eq, value: MR}
    - type: filter
      name: keep_CT_MRI_only
      kind: keep
      scope: row
      logic: or
      rules:
        - column: Modality
          op: in
          value: [CT, MR, MRI]
        - column: sop_class
          op: in
          value:
            - CTImageStorage
            - EnhancedCTImageStorage
            - MRImageStorage
            - EnhancedMRImageStorage
            - LegacyConvertedEnhancedMRImageStorage
            - EnhancedMRColorImageStorage
    - type: filter
      name: discard_PET_CT
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: ModalitiesInStudy, op: contains, value: PT}
        - {column: ModalitiesInStudy, op: contains, value: NM}
    - type: filter
      name: discard_scouts_localizers
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: ImageType, op: contains, value: LOCALIZER}
        - {column: SeriesDescription, op: icontains, value: scout}
        - {column: SeriesDescription, op: icontains, value: localizer}
    - type: normalize_string
      column: SeriesDescription
    - type: filter
      name: discard_other_organs
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: SeriesDescription, op: icontains, value: crane}
        - {column: SeriesDescription, op: icontains, value: rachis}
        - {column: SeriesDescription, op: icontains, value: prostate}
        - {column: SeriesDescription, op: icontains, value: phlebo}
        - {column: SeriesDescription, op: icontains, value: meckel}
        - {column: SeriesDescription, op: icontains, value: femur}
        - {column: SeriesDescription, op: icontains, value: orl}
        - {column: BodyPartExamined, op: in, value: [BRAIN,HEAD,SKULL,NECK,ORBIT,EXTREMITY]}
    - type: pixel_spacing_xy
    - type: filter
      name: pixel_spacing_quality_CT
      kind: discard
      scope: row
      logic: and
      keep_null: true
      rules:
        - {column: PixelSpacingXY, op: gt, value: 1.5}
        - {column: Modality, op: eq, value: CT}
    - type: filter
      name: pixel_spacing_quality_MR
      kind: discard
      scope: row
      logic: and
      keep_null: true
      rules:
        - {column: PixelSpacingXY, op: gt, value: 1.8}
        - {column: Modality, op: eq, value: MR}
    - type: standardize_iop
    - type: classify_acquisition_plane
    - type: filter
      name: keep_axial_acquisition
      kind: keep
      scope: row
      logic: and
      keep_null: true
      rules:
        - {column: acquisition_axis, op: eq, value: Z}
    - type: build_volume_id
      # One composite step performs repeated-stack splitting and geometric
      # near-duplicate merging before rows are grouped into volumes.
      preferred_columns:
        - patient_key
        - study_id
        - series_id
        - ImageType
        - AcquisitionNumber
        - ImageOrientationPatient
        - SliceThickness
        - PixelSpacingXY
      fallback_columns: [patient_key, study_id, series_id]
      series_group_columns: [patient_key, study_id, series_id]
      split_z_tolerance: 0.01
      min_slices: 7
      min_repeated_slice_fraction: 0.7
      merge_group_columns:
        - patient_key
        - study_id
        - series_id
        - ImageType
        - ImageOrientationPatient
        - SliceThickness
        - PixelSpacingXY
      merge_z_sources: [ImagePositionPatient, SliceLocation]
      merge_z_tolerance: 0.001
    - type: group_volumes
    - type: compute_volume_length
    - type: filter
      name: remove_volumes_with_few_slices
      kind: discard
      scope: volume
      rules:
        - {column: n_files, op: lt, value: 3}
    - type: filter
      name: volume_length_quality
      kind: keep
      scope: volume
      logic: and
      keep_null: true
      rules:
        - {column: volume_length, op: gte, value: 10.0}
        - {column: volume_length, op: lte, value: 1700.0}
    - type: compute_visit_order
    - type: compute_acquisition_order
    - type: modality_curation
    - type: filter
      name: keep_MRI_T1_T2_only
      kind: keep
      scope: row
      logic: and
      keep_null: true
      rules:
        - {column: Modality, op: eq, value: MR}
        - {column: mri_sequence, op: in, value: [T1, T2]}
    - type: filter
      name: discard_mip_mpr
      kind: discard
      scope: row
      keep_null: true
      rules:
        - {column: is_mip_mpr, op: eq, value: true}         
    - type: finalize

# TotalSegmentator configuration by modality. MRI is accepted as an alias for
# MR. Backend kwargs under extra are passed through to TotalSegmentator.
segmentation:
  backend: totalsegmentator
  crop: true
  crop_margin_mm: 50.0
  # Operations run in order; output == input updates the mask in place.
  # radius_mm specifies a physical radius, not a diameter.
  modalities:
    CT:
      tasks:
        # Segment liver anatomy on CT.
        - task: total
          extra:
            roi_subset_robust: [liver]  # Liver only, with robust ROI localization.
            nr_thr_resamp: 2           # CPU threads for image resampling.

        # Detect liver lesions, including benign lesions.
        - task: liver_lesions
          extra:
            nr_thr_resamp: 2
          output: liver_tumor          # Logical name used by IMPERANDI.
          fetch_output: liver_lesions  # Backend mask name

      postprocess:
        # On geometry errors, warn and retain the input masks.
        # Missing/unreadable masks still fail the row.
        on_failure: warn_only
        operations:
          # Repair gaps and smooth indentations in the liver mask.
          - op: close
            input: liver
            output: liver
            radius_mm: 7.0

          # Fill enclosed cavities inside the liver.
          - op: fill_holes
            input: liver
            output: liver

          # Keep the main liver component; remove detached islands.
          - op: largest_cc
            input: liver
            output: liver

          # Keep lesion voxels inside the processed liver mask.
          # Strict clipping can truncate peripheral/exophytic lesions.
          - op: intersection
            inputs: [liver_tumor, liver]
            output: liver_tumor

          # Remove speckles and thin extensions from the lesion mask.
          # 3 mm can remove small lesions
          - op: open 
            input: liver_tumor
            output: liver_tumor
            radius_mm: 3.0

          # Fill enclosed lesion cavities, including possible necrotic regions.
          # Appropriate for whole-lesion ROIs; reconsider for viable-tumor ROIs.
          - op: fill_holes
            input: liver_tumor
            output: liver_tumor

    MR:
      tasks:
        # Segment liver anatomy with the MRI-specific model.
        - task: total_mr
          extra:
            roi_subset_robust: [liver]  # Liver only, with robust ROI localization.
            nr_thr_resamp: 2           # CPU threads for image resampling.

        # Detect liver lesions on MRI, including benign lesions.
        - task: liver_lesions_mr
          extra:
            nr_thr_resamp: 2
          output: liver_tumor          # Same logical name as for CT.
          fetch_output: liver_lesions  # MRI task also outputs "liver_lesions".

      postprocess:
        # On geometry errors, warn and retain the input masks.
        # Missing/unreadable masks still fail the row.
        on_failure: warn_only
        operations:
          # Repair gaps and smooth indentations in the liver mask.
          - op: close
            input: liver
            output: liver
            radius_mm: 7.0

          # Fill enclosed cavities inside the liver.
          - op: fill_holes
            input: liver
            output: liver

          # Keep the main liver component; remove detached islands.
          # Applied to liver only, preserving multiple lesion components.
          - op: largest_cc
            input: liver
            output: liver

          # Keep lesion voxels inside the processed liver mask.
          # Strict clipping can truncate peripheral/exophytic lesions.
          - op: intersection
            inputs: [liver_tumor, liver]
            output: liver_tumor

          # Remove speckles and thin extensions from the lesion mask.
          # 3 mm can remove small lesions
          - op: open
            input: liver_tumor
            output: liver_tumor
            radius_mm: 3.0

          # Fill enclosed lesion cavities, including possible necrotic regions.
          # Appropriate for whole-lesion ROIs; reconsider for viable-tumor ROIs.
          - op: fill_holes
            input: liver_tumor
            output: liver_tumor
    
# Intra-visit organ registration across modalities and shared tumor segmentation.
# Matching CLI options override consensus/output settings; this manifest defines
# the ordered registration stage chain.
registration:
  # Rows sharing every listed value form one registration group. Include
  # Modality for separate CT/MR groups; omit it to permit cross-modality groups.
  grouping_columns: [patient_key, exam_stage]
  # Publish results on each source scan grid or on the selected reference grid.
  output_space: reference # reference or moving
  # Also map additional mask_*_path columns when output_space is reference.
  transform_additional_masks: false
  # Mask-path columns; missing/empty organs skip the series, while missing/empty
  # tumors are omitted from fusion. Originals are retained as source_<column>.
  organ_mask_column: mask_liver_path
  tumor_mask_column: mask_liver_tumor_path
  # Organ fusion: anchor or majority.
  organ_consensus_method: majority
  # Tumor fusion: none, anchor, majority, intersection, union, or staple.
  # none retains each scan's own tumor (resampled for reference output), without clipping.
  tumor_consensus_method: union
  # Baseline and automatic PCA/geometry initialization precede these stages.
  initializer_minimum_dice_improvement: 0.001
  # Ordered refinement steps; omit a stage to disable it. Dice conditions skip
  # only that stage; MI still runs after sufficient organ overlap is reached.
  stages:
    - type: mask_rigid
      run_if: {dice_below: 0.98}
      acceptance: {minimum_dice_improvement: 0.001}
    - type: mask_affine
      run_if: {dice_below: 0.98}
    - type: mi_affine
      run_if: always
      optimizer: {iterations: 30}
      metric: {roi: organ_band, sampling_fraction: 0.2, sampling_seed: 42}
      acceptance: {minimum_mi_improvement: 0.0, maximum_dice_decrease: 0.05}
    # Cheap local shape correction when the accepted organ Dice is still low.
    - type: mask_elastic
      run_if: {dice_below: 0.85}
      optimizer: {iterations: 15}
      acceptance: {minimum_dice_improvement: 0.001}
    # Refine internal intensities using the same B-spline if shape correction
    # was accepted, otherwise initialize it after the last accepted linear step.
    - type: mi_elastic
      run_if: always
      optimizer: {iterations: 10}
      metric: {roi: organ, sampling_fraction: 0.2, sampling_seed: 42}
      acceptance: {minimum_mi_improvement: 0.0, maximum_dice_decrease: 0.05}
  # Coarse-to-fine optimization schedules. Skip the full-resolution level to
  # limit cost; acceptance still evaluates full-resolution source data.
  linear_shrink_factors: [8, 4, 2]
  linear_smoothing_sigmas_mm: [4, 2, 1]
  elastic_shrink_factors: [4, 2]
  elastic_smoothing_sigmas_mm: [2, 1]
  # Coarse B-spline mesh shared by both elastic stages.
  elastic_control_point_spacing_mm: 90.0
  minimum_consensus_dice: 0.92
  # Completeness heuristics; tune for the dataset and organ, not clinical cutoffs.
  partial_mask_boundary_margin_mm: 1.0
  accept_partial_organ_masks: true
  minimum_largest_component_fraction: 0.8
  minimum_accepted_organ_dice: 0.5
  minimum_common_field_of_view_fraction: 0.05
  # Reject PCA orientation candidates requiring a larger rigid rotation.
  maximum_pca_rotation_degrees: 45.0
  # Default maximum iterations per linear pyramid level; stages may override it.
  maximum_optimizer_iterations: 100
  # Elastic transform acceptability criteria  
  maximum_elastic_displacement_p95_mm: 18.0
  maximum_elastic_displacement_mm: 50.0
  minimum_elastic_jacobian_determinant: 0.1
  maximum_elastic_jacobian_determinant: 2.5
  # Distance-map crop margin in mm.
  distance_map_crop_padding_mm: 25.0
  # Signed-distance clamp and MI boundary-band half-width in mm.
  organ_boundary_band_half_width_mm: 15.0
  # Unclamped transfer-field crop and smooth native coverage transition.
  organ_distance_field_padding_mm: 10.0
  organ_coverage_blend_width_mm: 3.0
  # Keep original organ masks while mapping tumor consensus.
  preserve_source_organ_mask: false
  # Clip transferred tumors to the registered organ.
  clip_tumor_consensus_to_organ: true
  # Majority/STAPLE probability cutoff.
  consensus_probability_threshold: 0.5
  # Criteria are evaluated in list order, one column per item. A category list
  # gives most-to-least preferred values; min/max orders finite numeric values.
  reference_selection_priority:
    - Modality: [CT, MR]
    - phase: [PORTAL_VENOUS, ARTERIAL, DELAYED, NATIVE]
    - mri_sequence: [T1, T2]
    - PixelSpacingXY: min
    - SliceThickness: min
    - registration_organ_volume_mm3: max


radiomics:
  modalities:
    CT:
      pyradiomics:
        setting:
          # CT intensities are quantitative (HU): do NOT normalize.
          normalize: false
          # Standard fixed HU discretization.
          binWidth: 25
          # Harmonize voxel geometry before texture extraction.
          resampledPixelSpacing: [1, 1, 1]
          interpolator: sitkBSpline
          # Remove clearly non-soft-tissue voxels accidentally included in
          # liver / lesion masks while retaining fat, liver and tumor tissue.
          resegmentRange: [-100, 400]
          # Allow small image/mask geometry inconsistencies to be corrected.
          correctMask: true
        imageType:
          Original: {}

    MR:
      pyradiomics:
        setting:
          # MRI signal intensities are arbitrary and scanner/sequence dependent.
          # PyRadiomics performs z-score normalization before resampling.
          normalize: true
          normalizeScale: 100
          # Limit the influence of extreme intensity outliers after
          # normalization.
          removeOutliers: 3
          # After normalization to SD ~= 100, use a substantially smaller
          # fixed bin width than for CT.
          binWidth: 5
          # Avoid aggressive upsampling of typical liver MRI acquisitions,
          # especially those with relatively thick slices.
          resampledPixelSpacing: [2, 2, 2]
          interpolator: sitkBSpline
          correctMask: true

        imageType:
          Original: {}
  filters:
    #phase: [ARTERIAL, PORTAL_VENOUS]
