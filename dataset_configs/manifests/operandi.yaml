# OPERANDI cohort manifest. Comments explain each configurable stage while the
# values below retain the cohort's current production behavior.
# OPERANDI dataset configuration.
dataset_name: operandi

# Parse-time IDs. source accepts auto, tags, or path; auto prefers the DICOM
# keyword in from_tag and falls back to the source path.
id_extraction:
  source: auto
  force_dicom_read: false
  patient_key:
    from_tag: PatientName
    fallback: path
  study_id:
    from_tag: StudyInstanceUID
    fallback: path
  series_id:
    from_tag: SeriesInstanceUID
    fallback: path

# Trusted Python hook that rewrites patient_key during parsing.
id_standardization:
  hook_module: dataset_configs.hooks.operandi
  function: standardize_operandi_patient_key

# Optional enrichment hooks. from_column is passed to the hook; join_mode is
# missing_only (preserve existing columns) or overwrite (replace them).
derived_columns:
  - hook_module: dataset_configs.hooks.operandi
    function: extract_from_patient_key
    from_column: patient_key
    join_mode: missing_only

# Ordered resolution precedence. Supported types: ontology, rules, and
# totalsegmentator, with each type appearing at most once.
phase_curation:
  best_candidate_group_columns: [patient_key, exam_stage]
  text_columns:
    CT: [SeriesDescription, StudyDescription, ProtocolName]
    MR: [SeriesDescription, StudyDescription, ProtocolName]
  strategies:
    - type: explicit
      name: reviewed_assignments
      confidence: high
      assignments:
        - name: t1_generic
          phase: NATIVE
          rules:
            - {column: SeriesDescription, op: icontains, value: ax t1 in + out + w apnee}
        - name: parenchymateux_generic
          phase: DELAYED
          logic: and
          rules:
            - {column: Modality, op: eq, value: MR}
            - {column: SeriesDescription, op: icontains, value: parenchym}
        - name: 1-2-13-2_art
          phase: ARTERIAL
          logic: and
          rules:
            - {column: patient_key, op: eq, value: "1-2-13-2"}
            # Match ISO dates represented as either CSV strings or Python dates.
            - {column: date, op: regex, value: "^2017-04-01$"}
            - {column: Modality, op: eq, value: MR}
            - {column: SeriesDescription, op: icontains, value: ph1}
        - name: 1-2-13-2_port
          phase: PORTAL_VENOUS
          logic: and
          rules:
            - {column: patient_key, op: eq, value: "1-2-13-2"}
            - {column: date, op: regex, value: "^2017-04-01$"}
            - {column: Modality, op: eq, value: MR}
            - {column: SeriesDescription, op: icontains, value: ph3}
        - name: 1-2-13-2_tard
