# OPERANDI cohort manifest. Comments explain each configurable stage while the
# values below retain the cohort's current production behavior.
# OPERANDI dataset configuration.
dataset_name: operandi

# Parse-time IDs. source accepts auto, tags, or path; auto prefers the DICOM
# keyword in from_tag and falls back to the source path.
id_extraction:
  source: auto
  force_dicom_read: false
  patient_key:
    from_tag: PatientName
    fallback: path
  study_id:
    from_tag: StudyInstanceUID
    fallback: path
  series_id:
    from_tag: SeriesInstanceUID
    fallback: path

# Trusted Python hook that rewrites patient_key during parsing.
id_standardization:
  hook_module: dataset_configs.hooks.operandi
  function: standardize_operandi_patient_key

# Optional enrichment hooks. from_column is passed to the hook; join_mode is
# missing_only (preserve existing columns) or overwrite (replace them).
derived_columns:
  - hook_module: dataset_configs.hooks.operandi
    function: extract_from_patient_key
    from_column: patient_key
    join_mode: missing_only

# Ordered resolution precedence. Supported types: ontology, rules, and
# totalsegmentator, with each type appearing at most once.
phase_curation:
  strategies:
    - type: ontology
      name: operandi_phase_ontology
      columns: [ontology_phase]
      confidence: high
      # Exact, case-insensitive source labels mapped to canonical phase labels.
      mapping:
        native: NATIVE
        sans injection: NATIVE
        arterial: ARTERIAL
        arteriel: ARTERIAL
        artériel: ARTERIAL
        portal: PORTAL_VENOUS
        portale: PORTAL_VENOUS
        delayed: DELAYED
        tardif: DELAYED
    - type: rules
      name: metadata_rules
    - type: totalsegmentator
      name: totalsegmentator_prediction
      column: totalseg_phase
      modalities: [CT]
      confidence_columns:
        - totalseg_probability
        - totalseg_confidence
      mapping:
        native: NATIVE
        non_contrast: NATIVE
        no_contrast: NATIVE
        arterial: ARTERIAL
        arterial_early: ARTERIAL
        arterial_late: ARTERIAL
        portal: PORTAL_VENOUS
        venous: PORTAL_VENOUS
        portal_venous: PORTAL_VENOUS
        delayed: DELAYED
  unresolved_labels:
    - ""
    - OTHER
    - UNKNOWN
    - UNCLASSIFIED
    - NONE
  fallback: OTHER

# Ordered cleaning workflow. Hook functions use `module:function` syntax
# and must declare outputs with @clean_hook.
cleaning:
  steps:
    - type: hook
      function: "dataset_configs.hooks.operandi:standardize_operandi_patient_key"
      source_columns: [patient_key]
    - type: hook
      function: "dataset_configs.hooks.operandi:extract_from_patient_key"
      source_columns: [patient_key]
    - type: coalesce_date
    - type: coalesce_time
    - type: sop_class
    - type: parse_image_type
    - type: filter
      name: scan_size_quality
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: Rows, op: is_null}
        - {column: Columns, op: is_null}
        - {column: SliceThickness, op: gt, value: 3.0}
    - type: filter
      # kind: keep|discard; scope: row|volume; logic: and|or.
      # Operators: eq, ne, in, not_in, contains, icontains, regex, lt, lte,
      # gt, gte, is_null, not_null. keep_null preserves incomplete rows.
      kind: keep
      scope: row
      logic: and
      rules:
        - column: Modality
          op: in
          value: [CT, MR, MRI]
        - column: sop_class
          op: in
          value:
            - CTImageStorage
            - EnhancedCTImageStorage
            - MRImageStorage
            - EnhancedMRImageStorage
    - type: filter
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: ModalitiesInStudy, op: contains, value: PT}
        - {column: ModalitiesInStudy, op: contains, value: NM}
    - type: filter
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: ImageType, op: contains, value: LOCALIZER}
        - {column: SeriesDescription, op: icontains, value: scout}
    - type: normalize_string
      column: SeriesDescription
    - type: filter
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: SeriesDescription, op: contains, value: pelvis}
        - {column: SeriesDescription, op: contains, value: crane}
        - {column: SeriesDescription, op: contains, value: rachis}
        - {column: SeriesDescription, op: contains, value: prostate}
        - {column: SeriesDescription, op: contains, value: phlebo}
        - {column: SeriesDescription, op: contains, value: meckel}
        - {column: SeriesDescription, op: contains, value: femur}
        - {column: SeriesDescription, op: contains, value: orl}
    - type: pixel_spacing_xy
    - type: filter
      name: pixel_spacing_quality
      kind: keep
      scope: row
      logic: and
      keep_null: true
      rules:
        - {column: PixelSpacingXY, op: lte, value: 1.25}
    - type: standardize_iop
    - type: classify_acquisition_plane
    - type: filter
      kind: keep
      scope: row
      logic: and
      rules:
        - {column: acquisition_axis, op: eq, value: Z}
    - type: build_volume_id
      # One composite step performs repeated-stack splitting and geometric
      # near-duplicate merging before rows are grouped into volumes.
      preferred_columns:
        - patient_key
        - study_id
        - series_id
        - ImageType
        - AcquisitionNumber
        - ImageOrientationPatient
        - SliceThickness
        - PixelSpacingXY
      fallback_columns: [patient_key, study_id, series_id]
      series_group_columns: [patient_key, study_id, series_id]
      split_z_tolerance: 0.01
      min_slices: 8
      min_repeated_slice_fraction: 0.7
      merge_group_columns:
        - patient_key
        - study_id
        - series_id
        - ImageType
        - ImageOrientationPatient
        - SliceThickness
        - PixelSpacingXY
      merge_z_sources: [ImagePositionPatient, SliceLocation]
      merge_z_tolerance: 0.001
    - type: group_volumes
    - type: compute_volume_length
    - type: filter
      name: volume_length_quality
      kind: keep
      scope: volume
      logic: and
      keep_null: true
      rules:
        - {column: volume_length, op: gte, value: 30.0}
        - {column: volume_length, op: lte, value: 1700.0}
    - type: compute_visit_order
    - type: compute_acquisition_order
    - type: modality_curation
    - type: finalize

# TotalSegmentator configuration by modality. MRI is accepted as an alias for
# MR. Backend kwargs under extra are passed through to TotalSegmentator.
segmentation:
  backend: totalsegmentator
  modalities:
    CT:
      tasks:
        - task: total
          extra:
            roi_subset_robust: [liver]
        - task: liver_lesions
          output: liver_tumor
          fetch_output: liver_lesions
      postprocess:
        on_failure: warn_only
        operations:
          - op: union
            inputs: [liver, liver_tumor]
            output: liver
          - op: close
            input: liver
            output: liver
            radius_mm: 5.0
          - op: fill_holes
            input: liver
            output: liver
          - op: largest_cc
            input: liver
            output: liver
          - op: intersection
            inputs: [liver_tumor, liver]
            output: liver_tumor
    MR:
      tasks:
        - task: total_mr
          extra:
            roi_subset_robust: [liver]
        - task: liver_lesions_mr
          output: liver_tumor
          fetch_output: liver_lesions
      postprocess:
        on_failure: warn_only
        operations:
          - op: union
            inputs: [liver, liver_tumor]
            output: liver
          - op: close
            input: liver
            output: liver
            radius_mm: 5.0
          - op: fill_holes
            input: liver
            output: liver
          - op: largest_cc
            input: liver
            output: liver
          - op: intersection
            inputs: [liver_tumor, liver]
            output: liver_tumor

# Manifest-grouped organ registration and shared tumor segmentation.
# Explicit CLI consensus-method and optional-stage options override these settings.
registration:
  grouping_columns: [patient_key, study_id, Modality]
  organ_mask_column: mask_liver
  tumor_mask_column: mask_liver_tumor
  organ_consensus_method: anchor
  tumor_consensus_method: anchor
  enable_affine_stage: false
  enable_elastic_stage: false
  # Optional CUDA backend for mask_rigid/mask_affine only.
  mask_registration_backend: simpleitk
  fireants_fallback_to_simpleitk: true
  fireants_coarse_spacing_mm: 4.0
  fireants_rigid_learning_rate: 0.003
  fireants_affine_learning_rate: 0.01
  elastic_control_point_spacing_mm: 90.0
  elastic_optimizer_iterations: 25
  maximum_elastic_displacement_p95_mm: 8.0
  maximum_elastic_displacement_mm: 12.0
  minimum_elastic_jacobian_determinant: 0.5
  maximum_elastic_jacobian_determinant: 2.0
  early_stop_organ_dice: 0.95
  # Dataset-dependent QC: edge contact suggests partial coverage.
  partial_mask_boundary_margin_mm: 1.0
  accept_partial_organ_masks: true
  minimum_largest_component_fraction: 0.8
  minimum_accepted_organ_dice: 0.5
  minimum_consensus_dice: 0.8
  minimum_common_field_of_view_fraction: 0.05
  maximum_pca_rotation_degrees: 45.0
  minimum_stage_dice_improvement:
    geometry: 0.001
    pca: 0.001
    mask_rigid: 0.002
    mask_affine: 0.002
    mask_elastic: 0.005
  minimum_stage_mi_improvement:
    mi_affine: 0.0
  maximum_mi_stage_dice_decrease: 0.002
  maximum_optimizer_iterations: 100
  distance_map_crop_padding_mm: 25.0
  # Signed-distance clamp and MI boundary-band half-width in mm.
  organ_boundary_band_half_width_mm: 15.0
  # Unclamped transfer-field crop and smooth native coverage transition.
  organ_distance_field_padding_mm: 10.0
  organ_coverage_blend_width_mm: 3.0
  # Keep original organ masks while mapping tumor consensus.
  preserve_source_organ_mask: false
  clip_tumor_consensus_to_organ: true
  consensus_probability_threshold: 0.5
  reference_selection_priority:
    - Modality: [CT, MR]
    - phase: [PORTAL_VENOUS, ARTERIAL, DELAYED, NATIVE]
    - mri_sequence: [T1, T2, DWI]
    - PixelSpacingXY: min
    - SliceThickness: min
    - registration_organ_volume_mm3: max

radiomics:
  # Native PyRadiomics parameter mapping plus cohort filters applied before
  # extraction. Multiple filter columns are combined with AND.
  modalities:
    CT:
      pyradiomics:
        setting:
          binWidth: 25
          resampledPixelSpacing: [1, 1, 1]
          resegmentRange: [-150, 250]
          correctMask: true
        imageType:
          Original: {}
    MR:
      pyradiomics:
        setting:
          binWidth: 25
          resampledPixelSpacing: [1, 1, 1]
          # MR intensities do not use the CT HU resegmentation range.
          correctMask: true
        imageType:
          Original: {}
  filters:
    phase: [ARTERIAL, PORTAL_VENOUS]
