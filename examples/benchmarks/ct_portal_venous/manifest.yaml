# Candidate inventory and native metadata ranking; paper inclusion is documented in README.md.
dataset_name: tcga_lihc_ct_portal_venous_candidates
id_extraction:
  source: tags
  force_dicom_read: false
  patient_key: {from_tag: PatientID, fallback: path}
  study_id: {from_tag: StudyInstanceUID, fallback: path}
  series_id: {from_tag: SeriesInstanceUID, fallback: path}
phase_curation:
  best_candidate_group_columns: [patient_key, date]
  text_columns:
    CT: [SeriesDescription, ImageComments, StudyDescription, ProtocolName]
    MR: [SeriesDescription, ImageComments, StudyDescription, ProtocolName]
  strategies:
    - type: rules
      name: metadata_phase_candidates
    - type: totalsegmentator
      name: totalsegmentator_prediction
      column: totalseg_phase
      modalities: [CT]
      confidence_columns:
        - totalseg_probability
        - totalseg_confidence
      mapping:
        native: NATIVE
        non_contrast: NATIVE
        no_contrast: NATIVE
        arterial: ARTERIAL
        arterial_early: ARTERIAL
        arterial_late: ARTERIAL
        portal: PORTAL_VENOUS
        venous: PORTAL_VENOUS
        portal_venous: PORTAL_VENOUS
        delayed: DELAYED
  unresolved_labels: ["", OTHER, UNKNOWN, UNCLASSIFIED, NONE]
  fallback: OTHER
cleaning:
  steps:
    - type: coalesce_date
      candidates: [StudyDate, SeriesDate, AcquisitionDate]
    - type: coalesce_time
    - type: filter
      name: retain_ct_candidates
      kind: keep
      scope: row
      logic: and
      rules:
        - {column: Modality, op: eq, value: CT}

    - type: filter
      name: discard_localizers
      kind: discard
      scope: row
      logic: or
      rules:
        - {column: ImageType, op: contains, value: LOCALIZER}
        - {column: SeriesDescription, op: icontains, value: localizer}
        - {column: SeriesDescription, op: icontains, value: scout}

    - type: filter
      name: discard_very_thick_acquisitions
      kind: discard
      scope: row
      rules:
        - {column: SliceThickness, op: gt, value: 15.0}

    - type: pixel_spacing_xy
    - type: standardize_iop
    - type: classify_acquisition_plane
    - type: build_volume_id
      preferred_columns: [patient_key, study_id, series_id, ImageType, AcquisitionNumber, ImageOrientationPatient, SliceThickness, PixelSpacingXY]
      fallback_columns: [patient_key, study_id, series_id]
      series_group_columns: [patient_key, study_id, series_id]
      split_z_tolerance: 0.01
      min_slices: 1
      min_repeated_slice_fraction: 0.7
      merge_group_columns: [patient_key, study_id, series_id, ImageType, ImageOrientationPatient, SliceThickness, PixelSpacingXY]
      merge_z_sources: [ImagePositionPatient, SliceLocation]
      merge_z_tolerance: 0.001
    - type: group_volumes
    - type: compute_volume_length
    - type: compute_visit_order
    - type: compute_acquisition_order
    - type: modality_curation
    - type: filter
      name: discard_not_applicable_phase
      kind: discard
      scope: row
      rules:
        - {column: phase_status, op: eq, value: NOT_APPLICABLE}
    # - type: filter
    #   name: keep_portal_venous_phase
    #   kind: keep
    #   scope: row
    #   rules:
    #     - {column: phase, op: eq, value: PORTAL_VENOUS}
    - type: finalize
